# The setup-build action gets everything needed by buildAndTest into the workspace.
name: "Setup build environment (ninja, ccache, llvm, clang, lld)"
description: "Setup build environment (ninja, ccache, llvm, clang, lld)"

inputs:
  llvm-version:
    description: |
      LLVM version for checkout and build. Used for ccache value and checkout.
    required: true
  clang-version:
    description: |
      Clang and LLD version to use for compilation. Independent of LLVM version.
    required: false
    default: '20'
  python-version:
    description: |
      Python version to install.
    required: false
    default: '3.11.13'
runs:
  # This is a composite action - has a list of steps to execute.
  using: "composite"

  steps:
  # Checkout llvm at version specified in input argument.
  - uses: actions/checkout@v4
    with:
      repository: llvm/llvm-project
      ref: ${{ inputs.llvm-version }}
      path: llvm-project
      fetch-depth: 1

  # Apply the LLVM source patch that the Bazel build also applies (see
  # third_party/llvm/workspace.bzl), so that both builds test the same LLVM.
  # The other patches there only change Bazel files. The patch is made against
  # the pinned LLVM commit, so skip it when building llvm-project@HEAD.
  - name: Apply LLVM patch
    if: inputs['llvm-version'] != 'main'
    shell: bash
    run: |
      patch_file="$GITHUB_WORKSPACE/third_party/llvm/generated.patch"
      # With no patches, the file holds only a header line, which `patch`
      # would reject.
      if grep -q '^diff ' "$patch_file"; then
        patch -d "$GITHUB_WORKSPACE/llvm-project" -p1 --forward --fuzz=0 \
          --batch -i "$patch_file"
      fi

  # Setup C++ caching using ccache.
  # Cache key is a combination of OS arch and LLVM version.
  - name: Ccache for C++ compilation
    uses: hendrikmuhs/ccache-action@v1.2
    with:
      key: ${{ runner.os }}-stablehlo_build_assets-${{ inputs.llvm-version }}
      max-size: 4G

  - name: Install MLIR python requirements
    shell: bash
    run: |
      python3 -m pip install -r $GITHUB_WORKSPACE/llvm-project/mlir/python/requirements.txt
