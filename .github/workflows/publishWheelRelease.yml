name: Publish Python Wheel Release

on:
  workflow_dispatch:
  schedule:
    # Runs at 6:00 AM UTC, which is 10:00 PM previous day PST (UTC-8)
    - cron: '0 6 * * *'

# Ensure that only a single job or workflow using the same
# concurrency group will run at a time. This would cancel
# any in-progress jobs in the same github workflow and github
# ref (e.g. refs/heads/main or refs/pull/<pr_number>/merge).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TODO(fzakaria): Consider running this job only if a new commit for the day has been done
  cmake-build-wheel:
    # Only run scheduled CI on main repo
    if: (github.repository == 'openxla/stablehlo' || github.event_name != 'schedule')
    name: "cmake-build-wheel (Python ${{ matrix.python-version }})"
    env:
      LLVM_PROJECT_DIR: "llvm-project"
      LLVM_BUILD_DIR: "llvm-build"
      # The setup.py script expects the StableHLO build to be in 'build'
      STABLEHLO_BUILD_DIR: "build"
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    runs-on: ${{ github.repository == 'openxla/stablehlo' && 'linux-x86-n4-16' ||  'ubuntu-22.04'  }}
    container: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build-cmake:latest"

    steps:
    - name: Checkout StableHLO
      uses: actions/checkout@v4

    - name: Get LLVM Version
      id: llvm-version
      shell: bash
      run: |
        version="$(cat ./build_tools/llvm_version.txt)"
        if [[ -z "${version}" ]]; then
          echo "Error: build_tools/llvm_version.txt is empty." >&2
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Setup workspace
      uses: ./.github/actions/setup-build
      with:
        llvm-version: ${{ steps.llvm-version.outputs.version }}
        python-version: ${{ matrix.python-version }}

    # The actual tool need to execute the python build
    # TODO(fzakaria): Consider using cibuildwheel to build multiple wheels at
    # once and mark them as manylinux compatible.
    - name: Install build dependencies
      shell: bash
      run: |
        "$PYTHON_EXECUTABLE" -m pip install build

    - name: Configure and Build LLVM
      shell: bash
      run: |
        ./build_tools/github_actions/ci_build_cmake_llvm.sh "$LLVM_PROJECT_DIR" "$LLVM_BUILD_DIR"
      env:
          CMAKE_BUILD_TYPE: Release
          MLIR_ENABLE_BINDINGS_PYTHON: ON

    - name: Build and Test StableHLO with Python
      shell: bash
      run: |
        "$PYTHON_EXECUTABLE" -m pip install tensorflow-cpu nanobind==2.9
        "$PYTHON_EXECUTABLE" -m pip install -r "$LLVM_PROJECT_DIR/mlir/python/requirements.txt"
        ./build_tools/github_actions/ci_build_cmake.sh "$LLVM_BUILD_DIR" "$STABLEHLO_BUILD_DIR"
      env:
          CMAKE_BUILD_TYPE: Release
          STABLEHLO_ENABLE_BINDINGS_PYTHON: ON
          STABLEHLO_ENABLE_PYTHON_TF_TESTS: ON

    - name: Build and Test Python Wheel
      shell: bash
      run: |
        ./build_tools/github_actions/ci_build_python_wheel.sh "$GITHUB_WORKSPACE/${{ github.sha }}"

    - name: Upload an artifact
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: build_artifact-${{ matrix.python-version }}
        path: ${{ github.sha }}

  upload-tarballs:
    runs-on: 'ubuntu-24.04'
    needs: cmake-build-wheel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build_artifact-*
          path: ${{ github.sha }}
          merge-multiple: true

      - name: Get release version
        id: release-version
        shell: bash
        run: |
          version_h="stablehlo/dialect/Version.h"
          version_str="$(grep -A1 'getCurrentVersion' "${version_h}" | grep -o 'Version(.*[0-9])' || true)"
          regex='Version\(([0-9]+), ([0-9]+), ([0-9]+)\)'
          if [[ "${version_str}" =~ ${regex} ]]; then
            echo "tag=dev-wheels-v${BASH_REMATCH[1]}-${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Could not find current version string in ${version_h}" >&2
            exit 1
          fi

      - name: Release current commit
        uses: ncipollo/release-action@v1.13.0
        with:
          artifacts: "${{ github.sha }}/*.whl"
          artifactErrorsFailBuild: true
          token: "${{ secrets.PUBLISH_ACCESS_TOKEN }}"
          tag: "${{ steps.release-version.outputs.tag }}"
          name: "${{ steps.release-version.outputs.tag }}"
          removeArtifacts: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
